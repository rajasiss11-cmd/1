name: Build APK from zip

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unzip the Aura Bits project
        run: unzip -q aura-bits-repaired-1-apk.zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses and install platform 34
        run: |
          printf 'y\n%.0s' {1..50} | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Show tool versions
        run: |
          java -version
          gradle --version

      - name: Build debug APK
        working-directory: aura-bits-apk
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aura-bits-debug-apk
          path: aura-bits-apk/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
